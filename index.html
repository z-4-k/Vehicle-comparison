<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Vehicle Performance Database</title>

  <style>
    html,body{
      margin:0;
      min-height:100%;
      background:#f4f6f8;
      color:#101828;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    }

    #boot{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      box-sizing:border-box;
    }

    .boot-card{
      text-align:center;
      max-width:520px;
    }

    .boot-title{
      font-size:20px;
      font-weight:750;
      margin-bottom:8px;
    }

    .boot-status{
      color:#667085;
      font-size:14px;
    }

    button{
      margin-top:16px;
      padding:8px 14px;
      border:1px solid #d0d5dd;
      border-radius:8px;
      background:white;
      font:inherit;
    }
  </style>
</head>

<body>

<div id="boot">
  <div class="boot-card">
    <div class="boot-title">Vehicle Performance Database</div>
    <div id="bootStatus" class="boot-status">Loading application…</div>
    <button id="retry" hidden>Retry</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const SUPABASE_URL =
    "https://exnemncgdilpmjqsnkpg.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_kq78fMuPqd_9rqasLSw_pw_LvFAVhEn";

  const CACHE_KEY =
    "vehicle-performance-db:last-good-release:v1";

  const status = document.getElementById("bootStatus");
  const retry = document.getElementById("retry");

  function setStatus(text) {
    status.textContent = text;
  }

  function bytesToHex(buffer) {
    return [...new Uint8Array(buffer)]
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  async function verifyRelease(release) {
    if (!release || typeof release.html !== "string") {
      throw new Error("Invalid release.");
    }

    const bytes = new TextEncoder().encode(release.html);

    if (
      Number(release.size_bytes) !== bytes.length
    ) {
      throw new Error("Release size verification failed.");
    }

    const digest = await crypto.subtle.digest(
      "SHA-256",
      bytes
    );

    const actualHash = bytesToHex(digest);

    if (actualHash !== release.sha256) {
      throw new Error("Release checksum verification failed.");
    }

    return release;
  }

  async function fetchCurrentRelease() {
    const url = new URL(
      SUPABASE_URL + "/rest/v1/app_releases"
    );

    url.searchParams.set(
      "select",
      "version,html,sha256,size_bytes,created_at"
    );

    url.searchParams.set(
      "status",
      "eq.ready"
    );

    url.searchParams.set(
      "limit",
      "1"
    );

    const response = await fetch(url, {
      headers: {
        apikey: SUPABASE_PUBLISHABLE_KEY,
        Accept: "application/json"
      },
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        "Supabase returned HTTP " + response.status
      );
    }

    const releases = await response.json();

    if (!Array.isArray(releases) || releases.length !== 1) {
      throw new Error("No ready application release.");
    }

    return releases[0];
  }

  function saveLastGood(release) {
    try {
      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(release)
      );
    } catch (error) {
      console.warn(
        "Unable to cache application release:",
        error
      );
    }
  }

  function loadCachedRelease() {
    const value = localStorage.getItem(CACHE_KEY);

    if (!value) {
      throw new Error("No cached application release.");
    }

    return JSON.parse(value);
  }

  function launch(release) {
    document.open();
    document.write(release.html);
    document.close();
  }

  async function boot() {
    retry.hidden = true;

    try {
      setStatus("Checking current release…");

      const release =
        await verifyRelease(
          await fetchCurrentRelease()
        );

      setStatus(
        "Starting " + release.version + "…"
      );

      saveLastGood(release);
      launch(release);

    } catch (onlineError) {

      console.error(
        "Current release failed:",
        onlineError
      );

      try {
        setStatus(
          "Online release unavailable. Loading last known-good version…"
        );

        const cached =
          await verifyRelease(
            loadCachedRelease()
          );

        launch(cached);

      } catch (cacheError) {

        console.error(
          "Cached release failed:",
          cacheError
        );

        setStatus(
          "Application could not be loaded. " +
          onlineError.message
        );

        retry.hidden = false;
      }
    }
  }

  retry.addEventListener("click", boot);

  boot();
})();
</script>

</body>
</html>
